name: zero_air
description: The AI that lives on your finger.
publish_to: 'none'

version: 1.0.12+13

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown: ^0.7.3
  llamadart: ^0.8.16
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  dio: ^5.10.0
  image_picker: ^1.1.2
  http: ^1.6.0
  pdf: ^3.13.0
  webview_flutter: ^4.14.1
  archive: ^4.0.9
  crypto: ^3.0.3
  permission_handler: ^11.3.1
  record: ^7.1.1
  android_intent_plus: ^6.0.0
  flutter_overlay_window: ^0.5.0
  flutter_foreground_task: ^10.0.0
  audioplayers: ^6.8.1
  supabase_flutter: ^2.8.0
  flutter_secure_storage: ^9.2.2
  speech_to_text: ^7.4.0
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  path: ^1.9.1
  flutter_tts: ^4.2.5
  video_player: ^2.13.0
  web_socket_channel: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/templates/
    - assets/images/
    - assets/videos/
    - assets/kws/keywords.txt

hooks:
  user_defines:
    llamadart:
      llamadart_native_backends:
        platforms:
          android-arm64:
            backends: [vulkan]
            cpu_profile: full

