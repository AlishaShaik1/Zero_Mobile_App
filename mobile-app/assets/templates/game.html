<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Forge Game</title>
</head>
<body>
    <!-- BLOCK:app-core -->
    <style>
        body { margin: 0; background: #111; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; }
        canvas { background: #000; border: 2px solid #333; box-shadow: 0 0 20px rgba(0, 255, 255, 0.2); }
    </style>
    <h1>Game Canvas</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#0ff';
        ctx.fillText('Game Initialized', 150, 200);
        // Game loop logic goes here
    </script>
    <!-- /BLOCK:app-core -->
</body>
</html>
