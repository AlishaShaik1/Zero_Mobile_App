<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{{APP_TITLE}}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { z: { 50: '#f0faff', 100: '#e0f5ff', 900: '#0a0c10' } }, fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } }</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    {{SUPABASE_SCRIPT}}
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <style>
        [x-cloak] {
            display: none !important
        }

        * {
            box-sizing: border-box
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: #252933;
            border-radius: 2px
        }

        .toast {
            position: fixed;
            bottom: 72px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1d24;
            border: 1px solid #252933;
            border-radius: 8px;
            padding: 10px 18px;
            font-size: 13px;
            color: #fff;
            z-index: 9998;
            animation: fadeup .3s ease
        }

        @keyframes fadeup {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(8px)
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0)
            }
        }
    </style>
</head>

<body class="bg-gray-950 text-white min-h-screen font-sans antialiased">

    {{SUPABASE_INIT}}

    <!-- ── MAIN APP ── -->
    <div id="app" x-data="zeroApp()" x-init="init()" x-cloak>

        {{APP_HTML}}

    </div>
    <!-- ── END MAIN APP ── -->

    <!-- ZERO BADGE (fixed, always visible) -->
    <a href="https://zeroai.app" target="_blank" id="zero-badge" style="position:fixed;bottom:14px;right:14px;z-index:9999;
          background:#0c0e14;border:1px solid #252933;border-radius:8px;
          padding:6px 12px;display:flex;align-items:center;gap:7px;
          text-decoration:none;font-size:11px;font-family:monospace;color:#6b7280;
          box-shadow:0 2px 8px rgba(0,0,0,.4);transition:border-color .2s">
        <svg width="18" height="18" viewBox="0 0 26 26" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="26" height="26" fill="transparent" />
            <!-- Zero mascot pixel art -->
            <rect x="6" y="3" width="14" height="14" rx="1" fill="white" stroke="black" stroke-width="1" />
            <rect x="9" y="7" width="3" height="3" fill="#1E88E5" />
            <rect x="14" y="7" width="3" height="3" fill="#1E88E5" />
            <rect x="9" y="8" width="1" height="1" fill="white" />
            <rect x="14" y="8" width="1" height="1" fill="white" />
            <rect x="9" y="17" width="3" height="5" fill="black" />
            <rect x="14" y="17" width="3" height="5" fill="black" />
            <rect x="8" y="20" width="5" height="2" fill="black" />
            <rect x="13" y="20" width="5" height="2" fill="black" />
            <rect x="3" y="10" width="3" height="5" fill="black" />
            <rect x="20" y="10" width="3" height="5" fill="black" />
            <rect x="12" y="1" width="2" height="3" fill="black" />
            <rect x="11" y="0" width="4" height="1" fill="#FFD54F" />
        </svg>
        Built with <strong style="color:#00D4FF;margin-left:2px">ZERO</strong>
    </a>

    <script>
        { { SUPABASE_CLIENT_VAR } }

        function zeroApp() {
            return {
                // ── state ──────────────────────────────────────────────────────
                loading: false,
                user: null,
                toast: null,
                _toastTimer: null,

                // ── lifecycle ──────────────────────────────────────────────────
                async init() {
                    { { SUPABASE_AUTH_LISTEN } }
                    await this.onReady();
                },

                // ── helpers ────────────────────────────────────────────────────
                showToast(msg, dur = 2800) {
                    clearTimeout(this._toastTimer);
                    this.toast = msg;
                    this._toastTimer = setTimeout(() => this.toast = null, dur);
                },

    // ── APP LOGIC (AI generated) ────────────────────────────────────
{ { APP_JS } }
            // ── END APP LOGIC ───────────────────────────────────────────────
        }
}
    </script>

    <!-- Toast -->
    <template x-if="toast">
        <div class="toast" x-text="toast"></div>
    </template>

</body>

</html>
